name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m coverage run -m unittest discover -s tests -q
          python -m coverage report

      - name: Run static checks
        run: python -m ruff check research_harness scripts tests

      # Explicit bash so $RUNNER_TEMP expands the same way on the
      # windows-latest runners (default shell there is pwsh, which does not
      # expand a bare $RUNNER_TEMP). windows-latest ships Git Bash.
      - name: Run no-network demo end-to-end
        shell: bash
        run: python scripts/research_state.py demo "$RUNNER_TEMP/deep-demo" --json

      - name: Verify installed CLI
        shell: bash
        run: deep-research-state demo "$RUNNER_TEMP/deep-demo-installed" --json

      # sdist/wheel build and dependency audit are platform-agnostic checks;
      # gate on one OS too so they run once per CI run, not once per OS.
      - name: Build and verify distributions
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Audit installed dependencies
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m pip_audit --skip-editable
